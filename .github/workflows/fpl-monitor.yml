name: FPL monitor

# Times are UTC. GitHub's scheduler is best-effort and can run several minutes
# late under load — the deadline job's T-minus windows have enough slack to
# absorb that, and every alert is deduped, so a late or repeated run is safe.
on:
  schedule:
    - cron: "0 7,9,11,13,15,17,19,21 * * *"   # status: every 2h, 08:00-22:00 UK
    - cron: "15 1 * * *"                       # prices: after the ~01:30 UK run
    - cron: "5 * * * *"                        # deadlines: hourly
  workflow_dispatch:
    inputs:
      job:
        description: "Which check to run"
        required: true
        default: all
        type: choice
        options: [all, status, prices, deadline]

concurrency:
  group: fpl-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet pyyaml requests

      # Snapshots are how price and status diffing works — without a restored
      # cache every run looks like a cold start and never alerts.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: fpl-state-${{ github.run_id }}
          restore-keys: fpl-state-

      - name: Pick the job for this schedule
        id: which
        run: |
          case "${{ github.event.schedule }}" in
            "15 1 * * *") echo "job=prices"   >> "$GITHUB_OUTPUT" ;;
            "5 * * * *")  echo "job=deadline" >> "$GITHUB_OUTPUT" ;;
            "")           echo "job=${{ inputs.job || 'all' }}" >> "$GITHUB_OUTPUT" ;;
            *)            echo "job=status"   >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run check
        env:
          FPL_TEAM_ID:    ${{ secrets.FPL_TEAM_ID }}
          FPL_LEAGUE_ID:  ${{ secrets.FPL_LEAGUE_ID }}
          FPL_NTFY_TOPIC: ${{ secrets.FPL_NTFY_TOPIC }}
          FPL_NOTIFIER:   ntfy
          FPL_TIMEZONE:   America/Montreal
          PYTHONPATH:     src
        run: python -m fpl.cli check "${{ steps.which.outputs.job }}"

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: fpl-state-${{ github.run_id }}
