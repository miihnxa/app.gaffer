name: Build Windows

# PyInstaller cannot cross-compile, so the Windows build has to happen on
# Windows. This runs on GitHub's runners; the macOS build stays local.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 1.3.0"
        required: true
        default: "1.3.0"
      release_tag:
        description: "Attach to this release tag (blank = artifact only)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Work out the version
        id: v
        shell: bash
        run: |
          if [ -n "${{ inputs.version }}" ]; then V="${{ inputs.version }}"
          else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building $V"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask requests pyyaml pywebview pyinstaller pillow
          # EdgeChromium (WebView2) is pywebview's Windows backend and needs
          # pythonnet to reach the .NET WebView2 control.
          pip install pythonnet

      - name: Refuse to ship anything personal
        shell: bash
        run: |
          if grep -rqiE "mihnea|cirstica|mourinho to the pl|6445742|631812" defaults/; then
            echo "defaults/ contains personal data"; exit 1
          fi
          echo "defaults/ is clean"

      - name: Build the icon
        run: python make-icon.py build-assets/gaffer.ico

      - name: Build
        env:
          GAFFER_VERSION: ${{ steps.v.outputs.version }}
        run: pyinstaller gaffer.spec --noconfirm --clean --log-level ERROR

      - name: Check the build
        shell: bash
        run: |
          test -f "dist/Gaffer/Gaffer.exe" || { echo "no exe produced"; exit 1; }
          if grep -rlq "Mihnea\|Cirstica\|6445742\|Mourinho" dist/Gaffer 2>/dev/null; then
            echo "personal data inside the build"; exit 1
          fi
          du -sh dist/Gaffer

      - name: Package
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          Compress-Archive -Path dist/Gaffer/* -DestinationPath "Gaffer-$v-Windows.zip"
          Get-FileHash "Gaffer-$v-Windows.zip" -Algorithm SHA256 | Format-List

      - uses: actions/upload-artifact@v4
        with:
          name: Gaffer-Windows
          path: Gaffer-*-Windows.zip

      - name: Attach to the release
        if: inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          [ -z "$TAG" ] && TAG="${GITHUB_REF_NAME}"
          gh release upload "$TAG" Gaffer-*-Windows.zip --clobber --repo "${{ github.repository }}"
